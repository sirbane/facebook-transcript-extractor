services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      WHISPER_CACHE: /models
    volumes:
      - whisper-cache:/models
    restart: unless-stopped

  mcp:
    build: .
    command: ["python", "mcp_server.py"]
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  whisper-cache:
